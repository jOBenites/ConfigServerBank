server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          # ponytail: backend nativo en classpath; pasar a Git backend solo si se necesita historial/remoto.
          search-locations: classpath:/config-repo

eureka:
  client:
    # Preparado para Fase II: cambiar a true quando exista service-registry.
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
